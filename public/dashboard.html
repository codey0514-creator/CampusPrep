<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Quill.js for Rich Text -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <nav>
        <h2>IIT Bhilai Placement Prep</h2>
        <span id="user-info"></span>
        <a href="/logout" class="btn">Logout</a>
    </nav>

    <div class="container">
        <section class="submit-section">
            <h3>Share Your Experience</h3>
            <input type="text" id="company" placeholder="Company Name (e.g., Google)">
            <input type="text" id="tags" placeholder="Tags (comma separated, e.g., SWE, OA)">
            <div id="editor-container" style="height: 150px; background: white;"></div>
            <label>
                <input type="checkbox" id="anonymous"> Post Anonymously
            </label>
            <button onclick="submitPost()" class="btn">Submit for Review</button>
        </section>

        <section class="feed-section">
            <h3>Approved Experiences</h3>
            <div id="feed"></div>
        </section>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const quill = new Quill('#editor-container', { theme: 'snow' });

        async function fetchUser() {
            const res = await fetch('/api/me');
            if(res.redirected) window.location.href = res.url;
            const user = await res.json();
            document.getElementById('user-info').innerText = `Welcome, ${user.name}`;
        }

        async function loadFeed() {
            const res = await fetch('/api/posts/approved');
            const posts = await res.json();
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            // Group by company logic can be expanded here, displaying flat list for now
            posts.reverse().forEach(post => {
                feed.innerHTML += `
                    <div class="card">
                        <h4>${post.company} <span class="tags">${post.tags.join(', ')}</span></h4>
                        <p class="author">By: ${post.authorName}</p>
                        <div class="content">${post.contentHtml}</div>
                        <button class="btn-upvote" onclick="upvote('${post.id}')">👍 Helpful (<span id="upvotes-${post.id}">${post.upvotes}</span>)</button>
                    </div>
                `;
            });
        }

        async function submitPost() {
            const data = {
                company: document.getElementById('company').value,
                tags: document.getElementById('tags').value,
                contentHtml: quill.root.innerHTML,
                isAnonymous: document.getElementById('anonymous').checked
            };
            
            await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert('Submitted successfully! Waiting for admin approval.');
            document.getElementById('company').value = '';
            document.getElementById('tags').value = '';
            quill.setContents([]);
        }

        async function upvote(id) {
            const res = await fetch(`/api/posts/upvote/${id}`, { method: 'POST' });
            const data = await res.json();
            if(data.success) {
                document.getElementById(`upvotes-${id}`).innerText = data.upvotes;
            }
        }

        fetchUser();
        loadFeed();
    </script>
</body>
</html>
