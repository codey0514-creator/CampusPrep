<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <h2>Admin Panel</h2>
        <a href="/dashboard.html" class="btn">View Live Feed</a>
        <a href="/logout" class="btn">Logout</a>
    </nav>

    <div class="container">
        <h3>Pending Verifications</h3>
        <div id="pending-feed"></div>
    </div>

    <script>
        async function loadPending() {
            const res = await fetch('/api/posts/pending');
            if(res.status === 403) {
                document.body.innerHTML = "<h1>Access Denied. You are not an admin.</h1>";
                return;
            }
            const posts = await res.json();
            const feed = document.getElementById('pending-feed');
            feed.innerHTML = '';
            
            posts.forEach(post => {
                feed.innerHTML += `
                    <div class="card">
                        <h4>${post.company} <span class="tags">${post.tags.join(', ')}</span></h4>
                        <p class="author">Submitted by: ${post.authorName} (${post.authorEmail})</p>
                        <p style="color: ${post.isAnonymous ? 'red' : 'green'}">
                            Requested Anonymous: ${post.isAnonymous}
                        </p>
                        <div class="content">${post.contentHtml}</div>
                        <button class="btn" style="background: green;" onclick="action('${post.id}', 'approve')">Approve</button>
                        <button class="btn" style="background: red;" onclick="action('${post.id}', 'reject')">Reject</button>
                    </div>
                `;
            });
        }

        async function action(id, type) {
            await fetch(`/api/admin/${type}/${id}`, { method: 'POST' });
            loadPending(); // Refresh list
        }

        loadPending();
    </script>
</body>
</html>
