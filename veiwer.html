<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPrep - Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CampusPrep</h1>
    </header>
    <main>
        <section>
            <h2>Placement Experiences</h2>
            <p>Search and explore experiences shared by students.</p>
        </section>
        <section>
            <input 
                type="text" 
                id="companySearch"
                placeholder="Search company..."
            >
            <button id="searchButton">Search</button>
        </section>
        <section>
            <button class="filter-button" data-filter="all">All</button>
            <button class="filter-button" data-filter="oa">OA</button>
            <button class="filter-button" data-filter="interview">Interview</button>
        </section>
        <section id="experiences">
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
