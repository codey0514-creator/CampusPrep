<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPrep - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h1>CampusPrep</h1>
        <p>Login strictly restricted to @iitbhilai.ac.in</p>

        <a href="/auth/google" class="btn google-btn">
            Sign in with Google
        </a>

        <p id="error-msg"></p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("error") === "denied") {
            document.getElementById("error-msg").innerText =
                "Access Denied. Ensure you are using your @iitbhilai.ac.in email.";
        }
    </script>
</body>
</html>
